name: Release APK

# Push a tag like v1.1.0 and this builds a signed APK and attaches it to a GitHub Release.
# The launcher's "Check for updates" reads the latest release and downloads the .apk attached to it,
# then installs it over the installed copy. That only works when every release is signed with the SAME key.
#
# Repository secrets needed (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    the keystore file, base64 encoded (base64 -w0 release.jks)
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Name the APK and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk "WishyLauncher-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "WishyLauncher-${GITHUB_REF_NAME}.apk" \
            --title "Wishy Launcher ${GITHUB_REF_NAME#v}" --generate-notes
