name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Theme core unit tests (plain JVM)
        run: ./gradlew :themecore:test --no-daemon
      - name: Build debug APK and run lint
        run: ./gradlew :app:assembleDebug :app:lintDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WishyLauncher-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Check the theme schema is valid JSON Schema
        run: |
          pip install jsonschema
          python3 -c "import json,jsonschema; jsonschema.Draft202012Validator.check_schema(json.load(open('schema/wishy-theme.schema.v1.json')))"
